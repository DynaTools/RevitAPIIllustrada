title: "Clash\nResolver"
tooltip: "Detecta clashes entre o modelo Host e um link, calcula o menor deslocamento (MTV) para separar e move os elementos do Host. Marca como resolviveis os clashes com penetracao ate o limite em mm; o usuario seleciona e clica em Resolver. So move elementos do Host (elementos dentro de links nao podem ser movidos pelo host)."
author: "Paulo Giavoni"
engine_type: cpython
min_revit_version: "2021"
